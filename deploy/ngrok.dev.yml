version: 3
endpoints:
  - name: triage-api
    url: https://triage-api.internal
    upstream: { url: 8000 }
  - name: triage-web
    url: https://triage-web.internal
    upstream: { url: 3000 }
  # No url: uses the account's dev domain. Google never sees it; the OAuth redirect is idp.ngrok.com.
  - name: triage
    traffic_policy_file: deploy/.traffic-policy.local.yml
    upstream: { url: 3000 }
